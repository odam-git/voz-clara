<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Voz Clara">
<title>Voz Clara</title>
<style>
/* ===== Tokens ===== */
:root{color-scheme:light dark;
  --bg:#f5f6fa;--card:#fff;--ink:#1c1c1e;--muted:#5d6475;--line:#1c1c1e1a;
  --pri:#0D2B5A;--btn:#0D2B5A;--btn-ink:#fff;--acc:#2369c9;--tint:#2f7de114;
  --ok:#1a8a4a;--warn:#b45309;--bad:#c53030;--r:16px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --t-title:22px;--t-head:18px;--t-body:16px;--t-cap:13px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.16,1,.3,1)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#18202f;--ink:#eef1f7;--muted:#a3acbe;--line:#ffffff1a;--pri:#9dbdff;--btn:#3767c9;--acc:#6aa6ff;--tint:#6aa6ff1a;--ok:#3ccf7a;--warn:#f0a43a;--bad:#ff6b66}}
/* ===== Base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:var(--t-body)/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  padding:0 var(--safe-r) calc(72px + var(--safe-b)) var(--safe-l);overscroll-behavior-y:none}
header{padding:calc(var(--s4) + var(--safe-t)) var(--s4) var(--s1)}
h1{margin:0;font-size:var(--t-title);line-height:1.2;color:var(--pri);font-weight:700}
.sub{color:var(--muted);font-size:var(--t-cap);margin-top:2px}
main{padding:var(--s2) var(--s4);max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:var(--s4);margin:var(--s3) 0;box-shadow:0 1px 2px #0000000d,0 0 0 1px var(--line)}
h2{font-size:var(--t-head);line-height:1.3;margin:0 0 var(--s2);font-weight:650}
h3{font-size:var(--t-body);margin:var(--s3) 0 var(--s2);font-weight:650}
p{line-height:1.5;margin:var(--s2) 0}
.card>h3:first-child,.card>h2:first-child{margin-top:0}
/* ===== Botones ===== */
button{font:inherit;touch-action:manipulation}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);border:0;border-radius:12px;padding:var(--s3) var(--s4);min-height:50px;width:100%;margin-top:var(--s2);
  font-size:17px;font-weight:600;background:var(--btn);color:var(--btn-ink);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .15s var(--ease),opacity .15s var(--ease)}
.btn:active{transform:scale(.98);opacity:.9}
.btn.sec{background:transparent;color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.btn.rec{background:#c53030;color:#fff;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:var(--s2)}.row>*{flex:1}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
/* ===== Métricas ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);text-align:center}
.stat b{display:block;font-size:24px;line-height:1.2;color:var(--pri);font-variant-numeric:tabular-nums}.stat span{font-size:var(--t-cap);color:var(--muted)}
.target{font-size:20px;line-height:1.6;padding:var(--s3) var(--s4);border-radius:12px;background:var(--tint);margin:var(--s2) 0}
.w-ok{color:var(--ok)}.w-bad{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.trans{font-size:15px;color:var(--muted);min-height:22px;font-style:italic;margin-top:var(--s2)}
.timer{font-size:48px;font-weight:700;text-align:center;color:var(--pri);font-variant-numeric:tabular-nums;line-height:1.2}
.phase{text-align:center;font-size:20px;font-weight:600}
.circle{width:144px;height:144px;border-radius:50%;margin:var(--s4) auto;background:var(--acc);opacity:.85;transition:transform 4s ease-in-out}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:var(--t-cap);font-weight:600;background:var(--tint);color:var(--acc);margin:2px}
/* ===== Listas ===== */
.step{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:var(--s2) 0;border-bottom:1px solid var(--line)}.step:last-of-type{border-bottom:0}
button.step{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;text-align:left;cursor:pointer;transition:opacity .15s}
button.step:active{opacity:.6}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}.chk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.step .t{flex:1}.step small{color:var(--muted);display:block;font-size:var(--t-cap);margin-top:2px}
/* ===== Barra de pestañas ===== */
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;padding:0 var(--safe-r) var(--safe-b) var(--safe-l);
  background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;min-height:56px;padding:6px 0 4px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer}
nav button.on{color:var(--pri);font-weight:700}nav i{display:block;font-style:normal;font-size:22px;line-height:1.2;margin-bottom:2px}
/* ===== Logros ===== */
.badge{display:flex;gap:var(--s3);align-items:center;padding:var(--s2) 0}.badge .e{font-size:30px;filter:grayscale(1);opacity:.35}.badge.got .e{filter:none;opacity:1}
.badge small{color:var(--muted);display:block;font-size:var(--t-cap)}
canvas{width:100%;height:160px;display:block}
.meter{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:var(--s2) 0}.meter div{height:100%;background:var(--acc);width:0;transition:width .1s linear}
/* ===== Formularios ===== */
label{display:block;margin:var(--s3) 0 var(--s1);font-size:15px;font-weight:500}
input,select{width:100%;min-height:48px;padding:var(--s3);border-radius:12px;border:1px solid var(--line);font-size:16px;background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=time]{display:block}
/* ===== Avisos ===== */
#toasts{position:fixed;top:calc(var(--s3) + var(--safe-t));left:50%;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:var(--s2);width:min(calc(100% - 32px),440px);pointer-events:none}
.toast{background:var(--btn);color:#fff;padding:var(--s3) var(--s4);border-radius:14px;box-shadow:0 8px 24px #0004;font-size:15px;animation:entra .25s var(--ease)}
@keyframes entra{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.aviso{background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;padding:var(--s3) var(--s4);margin:var(--s3) 0;line-height:1.5;font-size:15px}
.aviso ol{padding-left:20px;margin:var(--s2) 0}
.hidden{display:none!important}
/* ===== Estrellas ===== */
.stars-box{text-align:center;margin-top:var(--s3)}
.stars{display:flex;gap:var(--s1);justify-content:center}
.stars button{min-width:48px;min-height:48px;font-size:34px;line-height:1;background:none;border:0;color:color-mix(in srgb,var(--muted) 45%,transparent);cursor:pointer;transition:transform .15s var(--ease),color .15s}
.stars button.on{color:#f5a524}.stars button:active{transform:scale(1.15)}
/* ===== Bienvenida ===== */
body.intro header,body.intro nav{display:none}body.intro{padding-bottom:0}
.intro-wrap{max-width:440px;margin:0 auto;padding:calc(var(--s6) + var(--safe-t)) var(--s2) calc(var(--s5) + var(--safe-b));display:flex;flex-direction:column}
.intro-logo{border-radius:18px;margin-bottom:var(--s5)}
.intro-title{font-size:32px;line-height:1.1;margin:0 0 var(--s2);color:var(--pri);letter-spacing:-.01em}
.intro-lead{font-size:18px;line-height:1.45;margin:0 0 var(--s5)}
.intro-list{list-style:none;padding:0;margin:0 0 var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
.intro-list li{display:flex;gap:var(--s3);align-items:flex-start}.intro-list span{font-size:22px;line-height:1.2}
.intro-list b{display:block;font-size:16px}.intro-list small{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:2px}
.opt{color:var(--muted);font-weight:400}.intro-foot{color:var(--muted);font-size:var(--t-cap);text-align:center;margin:var(--s3) 0 0}
@media (prefers-reduced-motion:reduce){.btn,.toast,.stars button,.meter div{transition:none;animation:none}}
</style>
</head>
<body>
<header><h1>Voz Clara</h1><div class="sub" id="greet"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script src="js/datos.js"></script>
<script src="js/estado.js"></script>
<script src="js/voz.js"></script>
<script src="js/analisis.js"></script>
<script src="js/flujo.js"></script>
<script src="js/progreso.js"></script>
<script src="js/vistas.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
