<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D2B5A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Voz Clara</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1A1A1A;--muted:#5d6475;--pri:#0D2B5A;--acc:#2f7de1;--ok:#1f9d55;--warn:#d97706;--bad:#c53030;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#18202f;--ink:#eef1f7;--muted:#9aa3b5;--pri:#8fb4ff}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{padding:18px 18px 6px}h1{margin:0;font-size:22px;color:var(--pri)}.sub{color:var(--muted);font-size:14px;margin-top:2px}
main{padding:8px 14px}.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 1px 3px #0001}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:12px 0 6px}p{line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;background:var(--pri);color:#fff;cursor:pointer;width:100%;margin-top:8px}
.btn.sec{background:transparent;color:var(--pri);border:2px solid var(--pri)}.btn.rec{background:var(--bad)}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat b{display:block;font-size:24px;color:var(--pri)}.stat span{font-size:12px;color:var(--muted)}
.target{font-size:20px;line-height:1.6;padding:12px;border-radius:12px;background:#2f7de114;margin:8px 0}
.w-ok{color:var(--ok)}.w-bad{color:var(--bad);text-decoration:underline wavy}
.trans{font-size:14px;color:var(--muted);min-height:20px;font-style:italic}
.timer{font-size:48px;font-weight:700;text-align:center;color:var(--pri);font-variant-numeric:tabular-nums}
.phase{text-align:center;font-size:20px;font-weight:600}
.circle{width:140px;height:140px;border-radius:50%;margin:14px auto;background:var(--acc);opacity:.85;transition:transform 4s ease-in-out}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:#2f7de11f;color:var(--acc);margin:2px}
.step{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #8882}.step:last-child{border:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex:none}.chk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.step .t{flex:1}.step small{color:var(--muted);display:block}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid #8883;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:11px;color:var(--muted)}nav button.on{color:var(--pri);font-weight:700}nav i{display:block;font-style:normal;font-size:20px}
.badge{display:flex;gap:12px;align-items:center;padding:8px 0}.badge .e{font-size:30px;filter:grayscale(1);opacity:.35}.badge.got .e{filter:none;opacity:1}
.badge small{color:var(--muted);display:block}
canvas{width:100%;height:160px}
.meter{height:10px;background:#8883;border-radius:6px;overflow:hidden}.meter div{height:100%;background:var(--acc);width:0;transition:width .1s}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--muted)}input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #8885;font-size:16px;background:var(--card);color:var(--ink)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;padding:12px 18px;border-radius:12px;z-index:9;box-shadow:0 4px 14px #0004;max-width:90%}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>Voz Clara</h1><div class="sub" id="greet"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script src="js/datos.js"></script>
<script src="js/estado.js"></script>
<script src="js/voz.js"></script>
<script src="js/progreso.js"></script>
<script src="js/vistas.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
